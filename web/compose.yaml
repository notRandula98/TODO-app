name: todo-app

include:
  - ../compose.yaml

services:
  frontend:
    build:
      context: .
    init: true
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      # The included backend Compose service explicitly listens on port 3000.
      API_BASE_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
