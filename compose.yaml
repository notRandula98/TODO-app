services:
  backend:
    build:
      context: ./api
    init: true
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/todo.db
      # Local Compose setup: create tables on the first run.
      # For production, apply migrations and disable synchronization.
      DB_SYNCHRONIZE: "true"
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  backend-data:
